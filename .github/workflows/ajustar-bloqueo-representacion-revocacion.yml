name: Ajustar bloqueo y representación en revocación

on:
  push:
    branches:
      - docs/anexo-g-procedimiento-revocacion
    paths:
      - .github/scripts/ajustar_bloqueo_y_representacion_revocacion.py
      - .github/workflows/ajustar-bloqueo-representacion-revocacion.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-g-procedimiento-revocacion

      - run: python .github/scripts/ajustar_bloqueo_y_representacion_revocacion.py

      - name: Validar
        run: |
          grep -q 'Ante cualquier falla de publicación, los servicios institucionales deberán rechazar inmediatamente' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'Persona o entidad que inicia la revocación' Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md
          grep -q 'REFERENCIA_AUTORIZACION_REPRESENTACION' Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md
          python - <<'PY'
          from pathlib import Path
          for name in [
              'Productos/Anexo_G_Procedimiento_Revocacion.md',
              'Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md',
          ]:
              data = Path(name).read_bytes()
              assert data.endswith(b'\n') and not data.endswith(b'\n\n')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_G_Procedimiento_Revocacion.md Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md
          git commit -m 'docs: bloquear certificados revocados y registrar representación'
          git push
