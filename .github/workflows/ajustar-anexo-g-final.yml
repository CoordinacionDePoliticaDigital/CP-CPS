name: Ajustar consistencia final Anexo G

on:
  push:
    branches:
      - docs/anexo-g-procedimiento-revocacion
    paths:
      - .github/scripts/ajustar_anexo_g_final.py
      - .github/workflows/ajustar-anexo-g-final.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-g-procedimiento-revocacion

      - run: python .github/scripts/ajustar_anexo_g_final.py

      - name: Validar
        run: |
          grep -q 'asignar y persistir la fecha y hora efectiva única' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'Un certificado revocado no será elegible para renovación' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'reproducida sin modificación en OCSP' Productos/Anexo_C_Matriz_Causas_Revocacion.md
          grep -q 'sustituida por el documento autoritativo' Productos/Anexos_D_al_G_Procedimientos_Operativos.md
          python - <<'PY'
          from pathlib import Path
          for name in [
              'Productos/Anexo_G_Procedimiento_Revocacion.md',
              'Productos/Anexo_C_Matriz_Causas_Revocacion.md',
              'Productos/Anexo_O_Formato_Revocacion.md',
              'Productos/Anexos_D_al_G_Procedimientos_Operativos.md',
          ]:
              data = Path(name).read_bytes()
              assert data.endswith(b'\n') and not data.endswith(b'\n\n')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_G_Procedimiento_Revocacion.md Productos/Anexo_C_Matriz_Causas_Revocacion.md Productos/Anexo_O_Formato_Revocacion.md Productos/Anexos_D_al_G_Procedimientos_Operativos.md
          git commit -m 'docs: alinear fecha efectiva y fuente autoritativa del Anexo G'
          git push
