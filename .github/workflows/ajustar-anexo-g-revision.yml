name: Ajustar Anexo G por revisión

on:
  push:
    branches:
      - docs/anexo-g-procedimiento-revocacion
    paths:
      - .github/scripts/ajustar_anexo_g_revision.py
      - .github/workflows/ajustar-anexo-g-revision.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-g-procedimiento-revocacion

      - run: python .github/scripts/ajustar_anexo_g_revision.py

      - name: Validar
        run: |
          grep -q 'sospecha razonable de compromiso' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'Certificados de servicios e infraestructura' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'canal institucional autenticado' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'cola transaccional u outbox' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'publicación pendiente' Productos/Anexo_G_Procedimiento_Revocacion.md
          python - <<'PY'
          from pathlib import Path
          data = Path('Productos/Anexo_G_Procedimiento_Revocacion.md').read_bytes()
          assert data.endswith(b'\n') and not data.endswith(b'\n\n')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_G_Procedimiento_Revocacion.md
          git commit -m 'docs: atender observaciones de revisión del Anexo G'
          git push
