name: Ajustar continuidad y acuse de revocación

on:
  push:
    branches:
      - docs/anexo-g-procedimiento-revocacion
    paths:
      - .github/scripts/ajustar_continuidad_acuse_revocacion.py
      - .github/workflows/ajustar-continuidad-acuse-revocacion.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-g-procedimiento-revocacion

      - run: python .github/scripts/ajustar_continuidad_acuse_revocacion.py

      - name: Validar
        run: |
          grep -q 'la primera falla de publicación activará inmediatamente' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'Persona o proceso autorizado que ejecutó: {{EJECUTOR}}' Formatos/CERTAC/06_Acuse_Revocacion_Titular_FEA.md
          python - <<'PY'
          from pathlib import Path
          for name in [
              'Productos/Anexo_G_Procedimiento_Revocacion.md',
              'Formatos/CERTAC/06_Acuse_Revocacion_Titular_FEA.md',
          ]:
              data = Path(name).read_bytes()
              assert data.endswith(b'\n') and not data.endswith(b'\n\n')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_G_Procedimiento_Revocacion.md Formatos/CERTAC/06_Acuse_Revocacion_Titular_FEA.md
          git commit -m 'docs: activar continuidad urgente y registrar ejecutor en acuse'
          git push
