name: Ajustar atomicidad y causal de solicitud

on:
  push:
    branches:
      - docs/anexo-g-procedimiento-revocacion
    paths:
      - .github/scripts/ajustar_atomicidad_y_causal_solicitud.py
      - .github/workflows/ajustar-atomicidad-causal-solicitud.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-g-procedimiento-revocacion

      - run: python .github/scripts/ajustar_atomicidad_y_causal_solicitud.py

      - name: Validar
        run: |
          grep -q 'dentro de una misma transacción atómica' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'Denominación normalizada de causal: {{DENOMINACION_CAUSAL}}' Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md
          grep -q 'Descripción de los hechos: {{DESCRIPCION_HECHOS}}' Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md
          python - <<'PY'
          from pathlib import Path
          for name in [
              'Productos/Anexo_G_Procedimiento_Revocacion.md',
              'Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md',
          ]:
              data = Path(name).read_bytes()
              assert data.endswith(b'\n') and not data.endswith(b'\n\n')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_G_Procedimiento_Revocacion.md Formatos/CERTAC/07_Solicitud_Revocacion_Agente_FEA.md
          git commit -m 'docs: confirmar revocación y outbox de forma atómica'
          git push
