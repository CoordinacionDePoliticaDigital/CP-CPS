name: Ajustar urgencia y referencias de acuse

on:
  push:
    branches:
      - docs/anexo-g-procedimiento-revocacion
    paths:
      - .github/scripts/ajustar_urgencia_referencias_acuse.py
      - .github/workflows/ajustar-urgencia-referencias-acuse.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-g-procedimiento-revocacion

      - run: python .github/scripts/ajustar_urgencia_referencias_acuse.py

      - name: Validar
        run: |
          grep -q 'Para toda revocación clasificada como urgente conforme a la sección 10' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'Referencia o identificador de la firma o sello' Formatos/CERTAC/06_Acuse_Revocacion_Titular_FEA.md
          grep -q 'Referencia o identificador de la firma del agente' Formatos/CERTAC/08_Acuse_Revocacion_Agente_FEA.md
          grep -q 'Referencia o identificador del sello' Formatos/CERTAC/08_Acuse_Revocacion_Agente_FEA.md

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_G_Procedimiento_Revocacion.md Formatos/CERTAC/06_Acuse_Revocacion_Titular_FEA.md Formatos/CERTAC/08_Acuse_Revocacion_Agente_FEA.md
          git commit -m 'docs: ampliar continuidad urgente y referenciar firmas de acuses'
          git push
