name: Actualizar Subject y Certificate Policies

on:
  push:
    branches:
      - docs/anexo-a-subject-politicas
    paths:
      - .github/scripts/actualizar_subject_politicas.py
      - .github/workflows/actualizar-subject-politicas.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-a-subject-politicas

      - run: python .github/scripts/actualizar_subject_politicas.py

      - name: Validar
        run: |
          grep -q 'Valor fijo: `Gobierno del Estado de Chihuahua`' Productos/Anexo_A_Perfil_Tecnico_Certificados.md
          grep -q 'en certificados ciudadanos deberá omitirse' CP-ACCHIH-001-v1.2-proyecto.md
          grep -q 'Certificate Policies' CPS-ACCHIH-001-v1.2-proyecto.md
          grep -q 'criterio canónico de clasificación' Productos/Anexo_A_Perfil_Tecnico_Certificados.md

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_A_Perfil_Tecnico_Certificados.md CP-ACCHIH-001-v1.2-proyecto.md CPS-ACCHIH-001-v1.2-proyecto.md
          git commit -m 'docs: definir O, OU y clasificación por Certificate Policies'
          git push
