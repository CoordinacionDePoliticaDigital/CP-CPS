name: Ajustar firma de agente y outbox Anexo O

on:
  push:
    branches:
      - docs/anexo-g-procedimiento-revocacion
    paths:
      - .github/scripts/ajustar_firma_agente_y_outbox_anexo_o.py
      - .github/workflows/ajustar-firma-agente-outbox-anexo-o.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/anexo-g-procedimiento-revocacion

      - run: python .github/scripts/ajustar_firma_agente_y_outbox_anexo_o.py

      - name: Validar
        run: |
          grep -q 'Toda revocación asistida requerirá la firma electrónica avanzada' Productos/Anexo_G_Procedimiento_Revocacion.md
          grep -q 'Referencia de eventos de publicación u outbox' Productos/Anexo_O_Formato_Revocacion.md
          grep -q 'Fecha y hora de confirmación de publicación' Productos/Anexo_O_Formato_Revocacion.md

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos/Anexo_G_Procedimiento_Revocacion.md Productos/Anexo_O_Formato_Revocacion.md
          git commit -m 'docs: exigir firma de agente y registrar outbox en Anexo O'
          git push
